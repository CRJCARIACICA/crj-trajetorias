  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef4f1;color:#17352f;font-family:Inter,Arial,sans-serif}.access-public-shell{min-height:100vh;display:grid;place-items:center;padding:18px}.access-public-card{width:min(720px,100%);background:#fff;border:1px solid #dce8e3;border-radius:24px;padding:22px;box-shadow:0 22px 70px rgba(14,56,47,.12)}.access-brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.access-mark{width:45px;height:45px;border-radius:13px;background:#0b5b4c;color:#fff;display:grid;place-items:center;font-weight:800}.access-brand b,.access-brand small{display:block}.access-brand small{color:#6c7e78}.access-hero{padding:18px;background:linear-gradient(135deg,#eaf7f2,#f8fcfa);border:1px solid #d4e9e1;border-radius:18px;margin-bottom:16px}.access-hero.compact{padding:15px}.access-hero h1{font-size:28px;line-height:1.08;margin:7px 0 8px}.access-hero p{margin:0;color:#557169;line-height:1.5}.access-kicker{display:inline-block;background:#d9eee6;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.access-stack{display:grid;gap:13px}.field{display:grid;gap:6px}.field label,.access-signature-block>label{font-weight:700}.field small{color:#667a73}.input,select{width:100%;border:1px solid #cddbd6;border-radius:12px;padding:13px 14px;font:inherit;background:#fff}.input:focus,select:focus{outline:3px solid rgba(11,91,76,.12);border-color:#0b5b4c}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.primary{background:#0b5b4c;color:#fff}.btn.ghost{background:#edf4f1;color:#17352f}.access-big{min-height:50px;font-size:16px}.access-choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.access-choice{border:1px solid #dce7e3;border-radius:12px;padding:11px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}.access-choice b,.access-choice small{display:block}.access-choice small{color:#687a74;margin-top:3px}.access-help{font-size:13px;color:#667a73;margin:0;line-height:1.45}.access-room-grid,.access-workshop-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.access-room,.access-workshop{border:1px solid #dbe7e2;border-radius:14px;padding:12px;display:flex;gap:9px;align-items:flex-start;cursor:pointer}.access-room b,.access-room small,.access-workshop b,.access-workshop small{display:block}.access-room small,.access-workshop small{font-size:12px;color:#6a7d76;margin-top:3px}.access-message{border-radius:13px;padding:12px 13px;margin-bottom:12px}.access-message p{margin:5px 0 0;line-height:1.45}.access-message.info{background:#eef6ff;border:1px solid #d1e4f6}.access-message.warn{background:#fff7e5;border:1px solid #eed28f}.access-message.danger{background:#fff0f0;border:1px solid #e9baba}.access-message h2{margin:0 0 6px}.access-search-results{border:1px solid #dce7e3;border-radius:14px;overflow:hidden;max-height:310px;overflow-y:auto}.access-person-result{display:grid;gap:4px;width:100%;border:0;border-bottom:1px solid #edf2f0;background:#fff;text-align:left;padding:13px;cursor:pointer}.access-person-result:last-child{border-bottom:0}.access-person-result:hover{background:#f2f8f5}.access-person-result b{font-size:15px}.access-person-result span{font-size:12px;color:#667a73}.access-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.access-signature-block{display:grid;gap:8px}.access-signature{width:100%;height:170px;border:2px dashed #a8c4bb;border-radius:14px;background:#fff;touch-action:none;cursor:crosshair}.access-signature-actions{display:flex;justify-content:flex-end}.access-success{text-align:center;padding:20px 6px}.access-check{width:72px;height:72px;border-radius:50%;background:#dff4ea;color:#0b5b4c;display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 12px}.access-success h1{margin:0 0 8px}.access-footer{text-align:center;color:#7c8c86;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.access-public-shell{padding:8px}.access-public-c
