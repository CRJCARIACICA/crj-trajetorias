<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b5b4c" />
  <title>Presença · CRJ Cariacica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef4f1;color:#17352f;font-family:Inter,Arial,sans-serif}.access-public-shell{min-height:100vh;display:grid;place-items:center;padding:18px}.access-public-card{width:min(650px,100%);background:#fff;border:1px solid #dce8e3;border-radius:24px;padding:22px;box-shadow:0 22px 70px rgba(14,56,47,.12)}.access-brand{display:flex;gap:10px;align-items:center;margin-bottom:18px}.access-mark{width:45px;height:45px;border-radius:13px;background:#0b5b4c;color:#fff;display:grid;place-items:center;font-weight:800}.access-brand b,.access-brand small{display:block}.access-brand small{color:#6c7e78}.access-hero{padding:18px;background:linear-gradient(135deg,#eaf7f2,#f8fcfa);border:1px solid #d4e9e1;border-radius:18px;margin-bottom:16px}.access-hero.compact{padding:15px}.access-hero h1{font-size:28px;line-height:1.08;margin:7px 0 8px}.access-hero p{margin:0;color:#557169}.access-kicker{display:inline-block;background:#d9eee6;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700}.access-stack{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-weight:700}.input,select{width:100%;border:1px solid #cddbd6;border-radius:12px;padding:13px 14px;font:inherit;background:#fff}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.btn.primary{background:#0b5b4c;color:#fff}.btn.ghost{background:#edf4f1;color:#17352f}.access-big{min-height:50px;font-size:16px}.access-choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.access-choice{border:1px solid #dce7e3;border-radius:12px;padding:11px;display:flex;gap:8px}.access-help{font-size:13px;color:#667a73;margin:0}.access-room-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.access-room{border:1px solid #dbe7e2;border-radius:14px;padding:12px;display:flex;gap:9px;align-items:flex-start}.access-room b,.access-room small{display:block}.access-room small{font-size:12px;color:#6a7d76;margin-top:3px}.access-message{border-radius:13px;padding:12px 13px;margin-bottom:12px}.access-message.info{background:#eef6ff}.access-message.warn{background:#fff7e5;border:1px solid #eed28f}.access-message.danger{background:#fff0f0;border:1px solid #e9baba}.access-message h2{margin:0 0 6px}.access-success{text-align:center;padding:20px 6px}.access-check{width:72px;height:72px;border-radius:50%;background:#dff4ea;color:#0b5b4c;display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 12px}.access-success h1{margin:0 0 8px}.access-footer{text-align:center;color:#7c8c86;font-size:12px}.hidden{display:none!important}@media(max-width:600px){.access-public-shell{padding:8px}.access-public-card{padding:16px;border-radius:18px}.access-hero h1{font-size:24px}.access-room-grid,.access-choice-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="access-app"></div>
  <script type="module" src="./src/access_public.js?v=20261006-1"></script>
</body>
</html>
