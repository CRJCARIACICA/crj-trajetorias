<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b5b4c">
  <title>Lista de Presença · CRJ Cariacica</title>
  <link rel="stylesheet" href="./assets/app.css?v=20261003-1">
</head>
<body>
  <main class="checkin-page">
    <section class="checkin-card">
      <div class="brand-mark">CRJ</div>
      <h1>Lista de presença</h1>
      <p class="muted">Identifique sua situação e o sistema mostrará somente a próxima etapa necessária.</p>
      <div id="checkin-draft-banner"></div>
      <div id="checkin-app"><div class="notice">Carregando lista...</div></div>
    </section>
  </main>
  <script type="module" src="./src/checkin.js?v=20261003-1"></script>
  <script type="module">
    import { CONFIG } from './src/config.js';

    const qs=new URLSearchParams(location.search);
    const cfdhMode=Boolean(qs.get('cfdh'));
    const token=qs.get('cfdh')||qs.get('token');
    const app=document.querySelector('#checkin-app');
    const banner=document.querySelector('#checkin-draft-banner');
    const localKey=token?'crj_checkin_draft_v4:'+token:null;
    const candidateKey=token?'crj_checkin_candidate_v4:'+token:null;
    const cpfKey=token?'crj_checkin_cpf_v4:'+token:null;
    let candidateId=candidateKey?sessionStorage.getItem(candidateKey):null;
    let dbPromise=null,saveTimer=null,lastForm=null,errorSavedFor=null;

    const esc=(v='')=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    async function getDb(){
      if(dbPromise)return dbPromise;
      dbPromise=(async()=>{
        let mod;
        try{mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm')}
        catch{mod=await import('https://esm.sh/@supabase/supabase-js@2.117.2')}
        return mod.createClient(CONFIG.supabaseUrl,CONFIG.supabasePublishableKey,{auth:{persistSession:false,autoRefreshToken:false}});
      })();
      return dbPromise;
    }

    function activeForm(){
      return app?.querySelector('#enroll-existing-form,#existing-cfdh-initial-form,#provisional-form,#visitor-form')||null;
    }
    function valuesOf(form){
      const values={};
      for(const el of form?.querySelectorAll('input,select,textarea')||[]){
        if(!el.name||el.name==='secret'||el.type==='password'||el.type==='file')continue;
        if((el.type==='checkbox'||el.type==='radio')&&!el.checked)continue;
        if(el.type==='checkbox'){
          values[el.name]??=[];
          values[el.name].push(el.value);
        }else values[el.name]=el.value;
      }
      return values;
    }
    function getDraft(){
      if(!localKey)return null;
      try{return JSON.parse(localStorage.getItem(localKey)||'null')}catch{return null}
    }
    function renderBanner(draft=getDraft()){
      if(!banner)return;
      if(!draft){banner.innerHTML='';return}
      let when='';
      try{when=new Date(draft.savedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{}
      banner.innerHTML='<div class="notice info"><b>Rascunho protegido'+(when?' · '+esc(when):'')+'</b><br>Se houver erro ou atualização da página, volte ao mesmo jovem/etapa. Os campos serão restaurados. Por segurança, senha e assinatura não são armazenadas.</div>';
    }
    function status(form,text){
      let el=form?.querySelector('[data-checkin-draft-status]');
      if(!form)return;
      if(!el){
        el=document.createElement('small');
        el.dataset.checkinDraftStatus='1';
        el.style.display='block';el.style.margin='4px 0 10px';el.style.opacity='.78';
        form.prepend(el);
      }
      if(el.textContent!==text)el.textContent=text;
    }
    function saveLocal(form,reason='alteração',quiet=false){
      if(!localKey||!form)return;
      const draft={formId:form.id,candidateId:candidateId||null,values:valuesOf(form),savedAt:new Date().toISOString(),reason};
      try{localStorage.setItem(localKey,JSON.stringify(draft))}catch{}
      renderBanner(draft);
      if(!quiet)status(form,'Rascunho salvo automaticamente.');
    }
    function restoreLocal(form){
      const draft=getDraft();
      if(!draft||draft.formId!==form.id)return false;
      if(draft.candidateId&&candidateId&&draft.candidateId!==candidateId)return false;
      for(const [name,value] of Object.entries(draft.values||{})){
        const fields=[...form.querySelectorAll('[name="'+CSS.escape(name)+'"]')];
        for(const el of fields){
          if(el.type==='password'||el.name==='secret')continue;
          if(el.type==='checkbox'||el.type==='radio')el.checked=Array.isArray(value)?value.includes(el.value):String(value)===el.value;
          else if(!el.value)el.value=value??'';
        }
      }
      status(form,'Rascunho restaurado. Confira os dados e informe novamente senha/assinatura.');
      return true;
    }
    async function saveServer(form){
      if(cfdhMode||!token||!candidateId||form?.id!=='enroll-existing-form')return;
      const v=valuesOf(form);
      try{
        const db=await getDb();
        await db.rpc('workshop_checkin_save_draft',{p_token:token,p_youth_id:candidateId,p_payload:{cpf:v.cpf||null,email:v.email||null,neighborhood:v.neighborhood||null,form_id:form.id}});
      }catch{}
    }
    async function restoreServer(form){
      if(cfdhMode||!token||!candidateId||form?.id!=='enroll-existing-form')return;
      try{
        const db=await getDb();
        const {data,error}=await db.rpc('workshop_checkin_get_draft',{p_token:token,p_youth_id:candidateId});
        if(error||!data)return;
        for(const name of ['cpf','email','neighborhood']){
          const el=form.elements.namedItem(name);
          if(el&&!el.value&&data[name])el.value=data[name];
        }
        if(Object.keys(data).length)status(form,'Rascunho recuperado do servidor. Informe novamente senha/assinatura.');
      }catch{}
    }
    async function clearDraft(){
      if(localKey)try{localStorage.removeItem(localKey)}catch{}
      renderBanner(null);
      if(!cfdhMode&&token&&candidateId){
        try{const db=await getDb();await db.rpc('workshop_checkin_clear_draft',{p_token:token,p_youth_id:candidateId})}catch{}
      }
    }
    async function resolveCandidateFromCpf(){
      if(candidateId||!token)return candidateId;
      const cpf=cpfKey?sessionStorage.getItem(cpfKey):null;
      if(!cpf)return null;
      try{
        const db=await getDb();
        const rpc=cfdhMode?'cfdh_checkin_cpf_status':'workshop_checkin_cpf_status';
        const {data,error}=await db.rpc(rpc,{p_token:token,p_cpf:cpf});
        if(!error&&data?.kind==='youth'&&data.candidate_id){
          candidateId=data.candidate_id;
          sessionStorage.setItem(candidateKey,candidateId);
        }
      }catch{}
      return candidateId;
    }
    async function prepare(form){
      if(!form||lastForm===form)return;
      lastForm=form;errorSavedFor=null;
      const primary=form.querySelector('button.btn.primary:not([type])');
      if(primary)primary.type='submit';
      restoreLocal(form);
      await resolveCandidateFromCpf();
      await restoreServer(form);
      if(!form.querySelector('[data-checkin-draft-status]'))status(form,'Rascunho automático ativo. Senha e assinatura não são armazenadas.');
    }
    function schedule(form){
      clearTimeout(saveTimer);
      saveTimer=setTimeout(()=>{saveLocal(form);saveServer(form)},250);
    }

    document.addEventListener('click',e=>{
      const c=e.target.closest?.('[data-candidate]');
      if(c?.dataset?.candidate){
        candidateId=c.dataset.candidate;
        if(candidateKey)sessionStorage.setItem(candidateKey,candidateId);
      }
      const btn=e.target.closest?.('#enroll-existing-form button.btn.primary,#existing-cfdh-initial-form button.btn.primary,#provisional-form button.btn.primary,#visitor-form button.btn.primary');
      if(btn){const form=btn.closest('form');saveLocal(form,'antes de concluir');saveServer(form)}
    },true);

    document.addEventListener('input',e=>{
      const form=e.target.closest?.('#enroll-existing-form,#existing-cfdh-initial-form,#provisional-form,#visitor-form');
      if(form){errorSavedFor=null;schedule(form)}
    },true);
    document.addEventListener('change',e=>{
      const form=e.target.closest?.('#enroll-existing-form,#existing-cfdh-initial-form,#provisional-form,#visitor-form');
      if(form){errorSavedFor=null;schedule(form)}
    },true);
    document.addEventListener('submit',e=>{
      const form=e.target;
      if(form?.id==='cpf-check-form'){
        const cpf=String(form.elements.namedItem('cpf')?.value||'');
        if(cpfKey)sessionStorage.setItem(cpfKey,cpf);
        candidateId=null;
        if(candidateKey)sessionStorage.removeItem(candidateKey);
        setTimeout(resolveCandidateFromCpf,300);
      }
      if(['enroll-existing-form','existing-cfdh-initial-form','provisional-form','visitor-form'].includes(form?.id)){
        saveLocal(form,'envio do formulário');
        saveServer(form);
      }
    },true);

    window.addEventListener('pagehide',()=>{const form=activeForm();if(form)saveLocal(form,'saída da página',true)});
    window.addEventListener('unhandledrejection',e=>{
      const form=activeForm();
      if(!form)return;
      saveLocal(form,'erro inesperado',true);saveServer(form);
      const btn=form.querySelector('button.btn.primary');
      if(btn){btn.disabled=false;if(btn.textContent==='Registrando...')btn.textContent='Assinar, inscrever e confirmar presença'}
      if(!form.querySelector('[data-draft-unhandled-error]')){
        const div=document.createElement('div');div.className='notice danger';div.dataset.draftUnhandledError='1';
        div.innerHTML='<b>Ocorreu um erro, mas o rascunho foi preservado.</b><br>Tente novamente sem recarregar a página.';
        form.prepend(div);
      }
      e.preventDefault?.();
    });

    const observer=new MutationObserver(()=>{
      const form=activeForm();
      if(form)prepare(form);
      const hasError=Boolean(form?.querySelector('.notice.danger'));
      if(hasError&&errorSavedFor!==form){
        errorSavedFor=form;
        saveLocal(form,'erro exibido',true);
        saveServer(form);
      }
      if(app?.querySelector('.checkin-success')&&!activeForm())clearDraft();
    });
    observer.observe(app,{childList:true,subtree:true});
    renderBanner();
    const first=activeForm();if(first)prepare(first);
  </script>
</body>
</html>
