name: Deploy CRJ Trajetórias to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Montar site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/assets

          cp \
            index.html \
            checkin.html \
            demanda.html \
            access.html \
            technical-checkin.html \
            .nojekyll \
            _site/

          cp \
            src/config.js \
            src/permissions.js \
            src/register.js \
            src/checkin.js \
            src/workshop_connection.js \
            src/jhonatao.js \
            src/jhonatao_multimodal.js \
            src/jhonatao_live.js \
            src/educator_complementary.js \
            src/form_access.js \
            src/initial_form_numeric_guard.js \
            src/meta4_3_ui.js \
            src/attendance_export_fix.js \
            src/export_route_override.js \
            src/numeric_error_explainer.js \
            src/plan_preview_capture.js \
            src/document_header_standard.js \
            src/feature_loader.js \
            src/route_lifecycle.js \
            src/educator_instructor_plan_sync.js \
            src/management_workspace.js \
            src/meta1_point_completion.js \
            src/meta2_flow_bootstrap.js \
            src/access_booking_youth.js \
            src/technical_support_requests.js \
            src/technical_service_flow.js \
            src/technical_team_enhancements.js \
            src/technical_program_actions.js \
            src/technical_workspace.js \
            src/technical_planning_governance.js \
            src/technical_checkin.js \
            src/access_controller.js \
            src/access_public.js \
            src/articulation_workspace.js \
            src/mobilization_governance.js \
            src/mobilization_planning.js \
            src/articulation_demand_identity.js \
            src/articulation_evidence.js \
            src/articulation_request_context.js \
            src/document_drafts.js \
            src/evidence_exports.js \
            src/universal_drafts.js \
            src/youth_profile_enhancements.js \
            src/youth_trajectory_evidence.js \
            src/youth_trajectory_exports.js \
            src/youth_list_fields.js \
            src/developer_view.js \
            src/workshop_devices.js \
            src/instructor_management.js \
            src/instructor_portal.js \
            src/instructor_planning.js \
            src/workshop_collaboration.js \
            src/workshop_live_sync.js \
            src/workshop_plan_delete.js \
            src/workshop_plan_exports.js \
            src/cfdh_program_metrics.js \
            src/cfdh_transversal_integration.js \
            src/goals_workspace.js \
            src/demand_public.js \
            src/demand_identity_public.js \
            src/team_comms.js \
            src/joint_actions.js \
            src/general_calendar.js \
            _site/src/

          cat bundle/src__app_js.*.part > _site/src/app.js
          cp assets/html2canvas.min.js _site/assets/
          cat bundle/src__api_js.*.part > _site/src/api.js
          cat bundle/src__forms_js.*.part > _site/src/forms.js
          cat bundle/src__agenda_js.*.part > _site/src/agenda.js
          cat bundle/assets__app_css.*.part assets/jhonatao.css assets/jhonatao_multimodal.css assets/jhonatao_jarvis.css > _site/assets/app.css

          # CFDH transversal é intencionalmente sobreposto a oficinas e outras agendas.
          # Somente o CFDH estrutural mantém bloqueio de conflito de horários.
          python - <<'PY'
          from pathlib import Path
          path=Path('_site/src/api.js')
          text=path.read_text(encoding='utf-8')
          start=text.find('      const existingConflict=(a.scheduled_date&&a.start_time&&aEnd)?crjCalendar.find(x=>{')
          same_plan=text.find("throw new Error('Ação '+(i+1)+': conflito com a Ação '+(j+1)+' do mesmo planejamento. Escolha outro horário.');",start)
          end=text.find('\n      }',same_plan)
          if start < 0 or same_plan < 0 or end < 0:
              raise SystemExit('Bloco de validação de conflito CFDH não encontrado; deploy interrompido para evitar regressão.')
          end += len('\n      }')
          original=text[start:end]
          replacement="""      // CFDH_TRANSVERSAL_ALLOW_OVERLAP: o transversal pode acontecer dentro ou junto de oficina,
              // ação, reunião, atendimento, evento ou qualquer outra agenda do CRJ.
              if(planType!=='cfdh_transversal'){
          """ + original.replace('\n','\n  ') + """
              }
          """
          path.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY

          sed -i 's#permissions.js?v=20261003-6#permissions.js?v=20261009-1#g' _site/src/app.js
          # Mantém os módulos centrais atualizados sem recolocar recursos pesados no HTML inicial.
          sed -i -E 's#src/export_route_override\.js\?v=[a-zA-Z0-9_-]+#src/export_route_override.js?v=20261016-1#g' _site/index.html
          sed -i -E 's#src/app\.js\?v=[a-zA-Z0-9_-]+#src/app.js?v=20261026-technical-service1#g' _site/index.html
          sed -i -E 's#src/feature_loader\.js\?v=[^\"]+#src/feature_loader.js?v=20261026-technical-service1#g' _site/index.html

          # A normalização de campos inteiros do Formulário Inicial é uma proteção global leve.
          # Ela precisa iniciar antes do app para impedir household_size="" em qualquer rota.
          if ! grep -q 'src/initial_form_numeric_guard.js' _site/index.html; then
            sed -i '/src\/app\.js/i\  <script type="module" src="./src/initial_form_numeric_guard.js?v=20261024-showcase1"></script>' _site/index.html
          fi
          sed -i -E 's#src/initial_form_numeric_guard\.js\?v=[a-zA-Z0-9_-]+#src/initial_form_numeric_guard.js?v=20261024-showcase1#g' _site/index.html

          # Todos os módulos devem compartilhar a MESMA instância do api.js.
          # URLs com query diferente são módulos ES diferentes para o navegador e podem
          # duplicar Supabase, sessão, subscriptions e estado interno.
          sed -i -E 's#api\.js\?v=[a-zA-Z0-9_-]+#api.js?v=20261023-checkin1#g' _site/src/*.js _site/index.html

      - name: Verificar navegação e regressões de interface
        run: |
          npm ci --prefix tests --ignore-scripts
          node --test tests/*.test.cjs

      - name: Validar JavaScript e arquivos obrigatórios
        run: |
          set -euo pipefail

          for file in _site/src/*.js; do
            node --input-type=module --check < "$file"
          done

          required=(
            _site/index.html
            _site/checkin.html
            _site/demanda.html
            _site/access.html
            _site/technical-checkin.html
            _site/src/app.js
            _site/src/api.js
            _site/src/workshop_connection.js
            _site/src/forms.js
            _site/src/agenda.js
            _site/src/permissions.js
            _site/src/feature_loader.js
            _site/src/route_lifecycle.js
            _site/src/educator_instructor_plan_sync.js
            _site/src/management_workspace.js
            _site/src/meta1_point_completion.js
            _site/src/meta2_flow_bootstrap.js
            _site/src/access_booking_youth.js
            _site/src/technical_support_requests.js
            _site/src/initial_form_numeric_guard.js
            _site/src/meta4_3_ui.js
            _site/src/technical_program_actions.js
            _site/src/technical_workspace.js
            _site/src/technical_planning_governance.js
            _site/src/technical_checkin.js
            _site/src/developer_view.js
            _site/src/document_header_standard.js
            _site/src/evidence_exports.js
            _site/src/export_route_override.js
            _site/src/numeric_error_explainer.js
            _site/src/joint_actions.js
            _site/src/general_calendar.js
            _site/src/cfdh_transversal_integration.js
            _site/src/youth_trajectory_evidence.js
            _site/src/youth_trajectory_exports.js
            _site/src/youth_list_fields.js
            _site/src/articulation_request_context.js
            _site/src/mobilization_governance.js
            _site/src/mobilization_planning.js
            _site/src/workshop_plan_exports.js
            _site/src/instructor_planning.js
            _site/assets/app.css
          )

          for file in "${required[@]}"; do
            test -s "$file"
          done

          grep -q 'ROUTE_FEATURES' _site/src/feature_loader.js
          grep -q 'management_workspace' _site/src/feature_loader.js
          grep -q 'meta1_point_completion' _site/src/feature_loader.js
          grep -q 'M1.1_CONTRATO' _site/src/meta1_point_completion.js
          grep -q 'M1.2_EQUIPE_PERCENTUAL' _site/src/meta1_point_completion.js
          grep -q 'M1.2_EQUIPE_PERCENTUAL' _site/src/management_workspace.js
          grep -q 'general_calendar' _site/src/feature_loader.js
          grep -q 'cfdh_transversal_integration' _site/src/feature_loader.js
          grep -q 'technical_workspace' _site/src/feature_loader.js
          grep -q 'goals_workspace' _site/src/feature_loader.js
          grep -q 'joint_actions' _site/src/feature_loader.js
          grep -q 'youth_list_fields' _site/src/feature_loader.js
          grep -q 'articulation_request_context' _site/src/feature_loader.js
          grep -q 'workshop_plan_exports' _site/src/feature_loader.js
          grep -q 'meta2_flow_bootstrap' _site/src/config.js
          grep -q 'access_create_booking_v2' _site/src/access_booking_youth.js
          grep -q 'Passagens e ingressos' _site/src/technical_support_requests.js
          grep -q 'feature_loader.js?v=20261026-technical-service1' _site/index.html
          grep -q 'initial_form_numeric_guard.js?v=20261024-showcase1' _site/index.html
          grep -q 'normalizeRestBody' _site/src/initial_form_numeric_guard.js
          grep -q 'meta4_3_ui.js?v=20261024-showcase1' _site/src/initial_form_numeric_guard.js
          grep -q 'mostra-profissoes' _site/src/route_lifecycle.js
          grep -q 'M4.3_ARTISTICO_CULTURAL' _site/src/meta4_3_ui.js
          grep -q 'professional_showcases' _site/src/meta4_3_ui.js
          grep -q 'technical-checkin.html' _site/src/technical_workspace.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/app.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/feature_loader.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/management_workspace.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/meta1_point_completion.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/youth_list_fields.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/articulation_request_context.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/workshop_plan_exports.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/initial_form_numeric_guard.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/meta4_3_ui.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/access_booking_youth.js
          grep -q 'api.js?v=20261023-checkin1' _site/src/technical_support_requests.js
          grep -q 'src/app.js?v=20261026-technical-service1' _site/index.html
          grep -q 'validateBinaryResponse' _site/src/export_route_override.js
          grep -q 'methodological_action' _site/src/articulation_request_context.js
          grep -q 'Imprimir evidência' _site/src/articulation_request_context.js
          grep -q 'crj-export-document-safe' _site/src/workshop_plan_exports.js
          grep -q 'Baixar planejamento do mês' _site/src/workshop_plan_exports.js
          grep -q 'availablePlanLessons' _site/src/cfdh_transversal_integration.js
          grep -q 'Aula da oficina para receber o CFDH' _site/src/cfdh_transversal_integration.js
          grep -q 'Pendente de elaboração do CFDH Compartilhado Transversal' _site/src/cfdh_transversal_integration.js
          grep -q 'CFDH_TRANSVERSAL_ALLOW_OVERLAP' _site/src/api.js

          # Nenhum JS publicado pode apontar para uma versão antiga de api.js.
          if grep -R -nP "api\.js\?v=(?!20261023-checkin1)" _site/src --include='*.js'; then
            echo 'Foi encontrada mais de uma versão de api.js nos módulos publicados.' >&2
            exit 1
          fi

          # Recursos de área não podem voltar a bloquear a primeira carga do sistema.
          if grep -Eq 'src/(technical_workspace|technical_program_actions|articulation_workspace|articulation_request_context|access_controller|goals_workspace|joint_actions|general_calendar|cfdh_transversal_integration|youth_list_fields|workshop_plan_exports|management_workspace|meta1_point_completion)\.js' _site/index.html; then
            echo 'Módulo pesado voltou ao carregamento inicial do index.html.' >&2
            exit 1
          fi

          # O cabeçalho institucional não deve mais disparar módulos de outras áreas.
          if grep -Eq "import\('./(technical_workspace|technical_planning_governance|youth_trajectory_evidence|youth_trajectory_exports)" _site/src/document_header_standard.js; then
            echo 'document_header_standard voltou a importar recursos de outras áreas.' >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
