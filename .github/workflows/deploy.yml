name: Deploy CRJ Trajetórias to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Montar site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/assets

          cp \
            index.html \
            checkin.html \
            demanda.html \
            access.html \
            technical-checkin.html \
            .nojekyll \
            _site/

          cp \
            src/config.js \
            src/permissions.js \
            src/register.js \
            src/checkin.js \
            src/jhonatao.js \
            src/jhonatao_multimodal.js \
            src/jhonatao_live.js \
            src/educator_complementary.js \
            src/form_access.js \
            src/initial_form_numeric_guard.js \
            src/attendance_export_fix.js \
            src/export_route_override.js \
            src/document_header_standard.js \
            src/feature_loader.js \
            src/technical_service_flow.js \
            src/technical_team_enhancements.js \
            src/technical_program_actions.js \
            src/technical_workspace.js \
            src/technical_planning_governance.js \
            src/technical_checkin.js \
            src/access_controller.js \
            src/access_public.js \
            src/articulation_workspace.js \
            src/articulation_demand_identity.js \
            src/articulation_evidence.js \
            src/document_drafts.js \
            src/evidence_exports.js \
            src/universal_drafts.js \
            src/youth_profile_enhancements.js \
            src/youth_trajectory_evidence.js \
            src/youth_trajectory_exports.js \
            src/developer_view.js \
            src/workshop_devices.js \
            src/instructor_management.js \
            src/instructor_portal.js \
            src/workshop_collaboration.js \
            src/workshop_live_sync.js \
            src/workshop_plan_delete.js \
            src/cfdh_program_metrics.js \
            src/cfdh_transversal_integration.js \
            src/goals_workspace.js \
            src/demand_public.js \
            src/demand_identity_public.js \
            src/team_comms.js \
            src/joint_actions.js \
            src/general_calendar.js \
            _site/src/

          cat bundle/src__app_js.*.part > _site/src/app.js
          cat bundle/src__api_js.*.part > _site/src/api.js
          cat bundle/src__forms_js.*.part > _site/src/forms.js
          cat bundle/src__agenda_js.*.part > _site/src/agenda.js
          cat bundle/assets__app_css.*.part assets/jhonatao.css assets/jhonatao_multimodal.css assets/jhonatao_jarvis.css > _site/assets/app.css

          sed -i 's#permissions.js?v=20261003-6#permissions.js?v=20261009-1#g' _site/src/app.js
          # Mantém os módulos centrais atualizados sem recolocar recursos pesados no HTML inicial.
          sed -i -E 's#src/export_route_override\.js\?v=[0-9-]+#src/export_route_override.js?v=20261013-4#g' _site/index.html
          sed -i -E 's#src/app\.js\?v=[0-9-]+#src/app.js?v=20261014-2#g' _site/index.html
          sed -i -E 's#src/feature_loader\.js\?v=[^\"]+#src/feature_loader.js?v=20261014-lazy2#g' _site/index.html

          # Todos os módulos devem compartilhar a MESMA instância do api.js.
          # URLs com query diferente são módulos ES diferentes para o navegador e podem
          # duplicar Supabase, sessão, subscriptions e estado interno.
          sed -i -E 's#api\.js\?v=[0-9-]+#api.js?v=20261014-2#g' _site/src/*.js _site/index.html

      - name: Validar JavaScript e arquivos obrigatórios
        run: |
          set -euo pipefail

          for file in _site/src/*.js; do
            node --input-type=module --check < "$file"
          done

          required=(
            _site/index.html
            _site/checkin.html
            _site/demanda.html
            _site/access.html
            _site/technical-checkin.html
            _site/src/app.js
            _site/src/api.js
            _site/src/forms.js
            _site/src/agenda.js
            _site/src/permissions.js
            _site/src/feature_loader.js
            _site/src/technical_program_actions.js
            _site/src/technical_workspace.js
            _site/src/technical_planning_governance.js
            _site/src/technical_checkin.js
            _site/src/developer_view.js
            _site/src/document_header_standard.js
            _site/src/evidence_exports.js
            _site/src/export_route_override.js
            _site/src/joint_actions.js
            _site/src/general_calendar.js
            _site/src/cfdh_transversal_integration.js
            _site/src/youth_trajectory_evidence.js
            _site/src/youth_trajectory_exports.js
            _site/assets/app.css
          )

          for file in "${required[@]}"; do
            test -s "$file"
          done

          grep -q 'ROUTE_FEATURES' _site/src/feature_loader.js
          grep -q 'general_calendar' _site/src/feature_loader.js
          grep -q 'cfdh_transversal_integration' _site/src/feature_loader.js
          grep -q 'technical_workspace' _site/src/feature_loader.js
          grep -q 'goals_workspace' _site/src/feature_loader.js
          grep -q 'joint_actions' _site/src/feature_loader.js
          grep -q 'feature_loader.js?v=20261014-lazy2' _site/index.html
          grep -q 'technical-checkin.html' _site/src/technical_workspace.js
          grep -q 'api.js?v=20261014-2' _site/src/app.js
          grep -q 'api.js?v=20261014-2' _site/src/feature_loader.js
          grep -q 'src/app.js?v=20261014-2' _site/index.html
          grep -q 'validateBinaryResponse' _site/src/export_route_override.js

          # Nenhum JS publicado pode apontar para uma versão antiga de api.js.
          if grep -R -nE "api\.js\?v=(?!20261014-2)" _site/src --include='*.js' -P; then
            echo 'Foi encontrada mais de uma versão de api.js nos módulos publicados.' >&2
            exit 1
          fi

          # Recursos de área não podem voltar a bloquear a primeira carga do sistema.
          if grep -Eq 'src/(technical_workspace|technical_program_actions|articulation_workspace|access_controller|goals_workspace|joint_actions|general_calendar|cfdh_transversal_integration)\.js' _site/index.html; then
            echo 'Módulo pesado voltou ao carregamento inicial do index.html.' >&2
            exit 1
          fi

          # O cabeçalho institucional não deve mais disparar módulos de outras áreas.
          if grep -Eq "import\('./(technical_workspace|technical_planning_governance|youth_trajectory_evidence|youth_trajectory_exports)" _site/src/document_header_standard.js; then
            echo 'document_header_standard voltou a importar recursos de outras áreas.' >&2
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
