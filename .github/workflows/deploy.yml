name: Deploy CRJ Trajetórias to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Montar e validar site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/assets
          cp index.html checkin.html demanda.html access.html .nojekyll _site/
          cp src/config.js src/permissions.js src/register.js src/checkin.js src/jhonatao.js src/jhonatao_multimodal.js src/jhonatao_live.js src/educator_complementary.js src/form_access.js src/technical_team_enhancements.js src/access_controller.js src/access_public.js src/articulation_workspace.js src/articulation_demand_identity.js src/articulation_evidence.js src/document_drafts.js src/universal_drafts.js src/youth_profile_enhancements.js src/developer_view.js src/workshop_devices.js src/instructor_management.js src/instructor_portal.js src/workshop_collaboration.js src/workshop_live_sync.js src/workshop_plan_delete.js src/cfdh_program_metrics.js src/demand_public.js src/demand_identity_public.js src/team_comms.js _site/src/
          cat bundle/src__app_js.*.part > _site/src/app.js
          cat bundle/src__api_js.*.part > _site/src/api.js
          cat bundle/src__forms_js.*.part > _site/src/forms.js
          cat bundle/src__agenda_js.*.part > _site/src/agenda.js
          # Força o app montado a usar a matriz de permissões mais recente, evitando cache de imports antigos.
          sed -i 's#permissions.js?v=20261003-6#permissions.js?v=20261006-3#g' _site/src/app.js
          cat bundle/assets__app_css.*.part assets/jhonatao.css assets/jhonatao_multimodal.css assets/jhonatao_jarvis.css > _site/assets/app.css
          node --check _site/src/app.js
          node --check _site/src/api.js
          node --check _site/src/forms.js
          node --check _site/src/permissions.js
          node --check _site/src/register.js
          node --check _site/src/agenda.js
          node --check _site/src/checkin.js
          node --check _site/src/jhonatao.js
          node --check _site/src/jhonatao_multimodal.js
          node --check _site/src/jhonatao_live.js
          node --check _site/src/educator_complementary.js
          node --check _site/src/form_access.js
          node --check _site/src/technical_team_enhancements.js
          node --check _site/src/access_controller.js
          node --check _site/src/access_public.js
          node --check _site/src/articulation_workspace.js
          node --check _site/src/articulation_demand_identity.js
          node --check _site/src/articulation_evidence.js
          node --check _site/src/document_drafts.js
          node --check _site/src/universal_drafts.js
          node --check _site/src/youth_profile_enhancements.js
          node --check _site/src/developer_view.js
          node --check _site/src/workshop_devices.js
          node --check _site/src/instructor_management.js
          node --check _site/src/instructor_portal.js
          node --check _site/src/workshop_collaboration.js
          node --check _site/src/workshop_live_sync.js
          node --check _site/src/workshop_plan_delete.js
          node --check _site/src/cfdh_program_metrics.js
          node --check _site/src/demand_public.js
          node --check _site/src/demand_identity_public.js
          node --check _site/src/team_comms.js
          node --input-type=module --check < _site/src/app.js
          node --input-type=module --check < _site/src/api.js
          node --input-type=module --check < _site/src/forms.js
          node --input-type=module --check < _site/src/agenda.js
          node --input-type=module --check < _site/src/checkin.js
          node --input-type=module --check < _site/src/jhonatao.js
          node --input-type=module --check < _site/src/jhonatao_multimodal.js
          node --input-type=module --check < _site/src/jhonatao_live.js
          node --input-type=module --check < _site/src/educator_complementary.js
          node --input-type=module --check < _site/src/form_access.js
          node --input-type=module --check < _site/src/technical_team_enhancements.js
          node --input-type=module --check < _site/src/access_controller.js
          node --input-type=module --check < _site/src/access_public.js
          node --input-type=module --check < _site/src/articulation_workspace.js
          node --input-type=module --check < _site/src/articulation_demand_identity.js
          node --input-type=module --check < _site/src/articulation_evidence.js
          node --input-type=module --check < _site/src/document_drafts.js
          node --input-type=module --check < _site/src/universal_drafts.js
          node --input-type=module --check < _site/src/youth_profile_enhancements.js
          node --input-type=module --check < _site/src/developer_view.js
          node --input-type=module --check < _site/src/workshop_devices.js
          node --input-type=module --check < _site/src/instructor_management.js
          node --input-type=module --check < _site/src/instructor_portal.js
          node --input-type=module --check < _site/src/workshop_collaboration.js
          node --input-type=module --check < _site/src/workshop_live_sync.js
          node --input-type=module --check < _site/src/workshop_plan_delete.js
          node --input-type=module --check < _site/src/cfdh_program_metrics.js
          node --input-type=module --check < _site/src/demand_public.js
          node --input-type=module --check < _site/src/demand_identity_public.js
          node --input-type=module --check < _site/src/team_comms.js
          test -s _site/index.html
          test -s _site/demanda.html
          test -s _site/access.html
          test -s _site/src/app.js
          test -s _site/src/api.js
          test -s _site/src/forms.js
          test -s _site/src/technical_team_enhancements.js
          test -s _site/src/access_controller.js
          test -s _site/src/access_public.js
          test -s _site/src/developer_view.js
          test -s _site/src/workshop_devices.js
          test -s _site/src/instructor_management.js
          test -s _site/src/instructor_portal.js
          test -s _site/src/workshop_collaboration.js
          test -s _site/src/workshop_live_sync.js
          test -s _site/src/workshop_plan_delete.js
          test -s _site/src/cfdh_program_metrics.js
          test -s _site/src/demand_public.js
          test -s _site/src/demand_identity_public.js
          test -s _site/src/youth_profile_enhancements.js
          test -s _site/src/articulation_demand_identity.js
          test -s _site/src/team_comms.js
          test -s _site/src/articulation_evidence.js
          test -s _site/src/document_drafts.js
          test -s _site/src/universal_drafts.js
          test -s _site/assets/app.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
