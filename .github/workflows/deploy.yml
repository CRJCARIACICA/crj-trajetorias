name: Deploy CRJ Trajetórias to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Montar e validar site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src _site/assets
          cp index.html .nojekyll _site/
          cp src/config.js src/permissions.js src/register.js _site/src/
          cat bundle/src__app_js.*.part > _site/src/app.js
          cat bundle/src__api_js.*.part > _site/src/api.js
          cat bundle/src__forms_js.*.part > _site/src/forms.js
          cat bundle/assets__app_css.*.part > _site/assets/app.css
          node --check _site/src/app.js
          node --check _site/src/api.js
          node --check _site/src/forms.js
          node --check _site/src/permissions.js\n          node --check _site/src/register.js
          test -s _site/index.html
          test -s _site/src/app.js
          test -s _site/src/api.js
          test -s _site/src/forms.js
          test -s _site/assets/app.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
