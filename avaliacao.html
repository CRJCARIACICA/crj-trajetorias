<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b5b4c">
  <meta name="referrer" content="no-referrer">
  <title>Avaliação · CRJ Cariacica</title>
  <link rel="stylesheet" href="./assets/app.css?v=20261109-avaliacoes">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eef5f1;color:#17352d;font-family:Inter,Arial,sans-serif}.ev-public{max-width:760px;margin:auto;padding:28px 16px 56px}.ev-brand{display:flex;align-items:center;gap:13px;margin-bottom:20px}.ev-brand b{font-size:17px}.ev-brand small{display:block;color:#5a746b}.ev-card{background:#fff;border:1px solid #dce9e1;border-radius:20px;padding:24px;box-shadow:0 12px 35px #173d2b0c}.ev-card h1{font-size:clamp(23px,5vw,32px);margin:6px 0 8px;line-height:1.2}.ev-kicker{font-size:12px;letter-spacing:.08em;font-weight:800;color:#0b795e;text-transform:uppercase}.ev-intro{line-height:1.55;color:#526c61}.ev-context{background:#eff9f3;border-radius:12px;padding:13px 15px;margin:16px 0;color:#155b46}.ev-field{display:grid;gap:7px;margin:17px 0}.ev-field label{font-weight:700;font-size:14px}.ev-field input,.ev-field textarea,.ev-field select{width:100%;padding:12px;border:1px solid #bfd2c8;border-radius:10px;background:white;color:#18372d;font:inherit}.ev-field input[readonly]{background:#f3f7f4;color:#526b5e}.ev-field input:focus,.ev-field textarea:focus,.ev-field select:focus{outline:3px solid #b1ddc9;border-color:#16816a}.ev-hint{color:#587166;line-height:1.5;font-size:14px}.ev-error{border-radius:10px;padding:12px;background:#fff0ef;color:#8b1e1e;margin:12px 0}.ev-submit{width:100%;min-height:48px;margin-top:12px}.ev-done{text-align:center;padding:24px 4px}.ev-done .ev-check{font-size:40px;color:#087659}.ev-done p{color:#587166;line-height:1.5}@media(max-width:520px){.ev-public{padding:16px 10px 36px}.ev-card{padding:18px;border-radius:16px}}
  </style>
</head>
<body>
  <main class="ev-public"><div class="ev-brand"><div class="brand-mark">CRJ</div><div><b>CRJ Cariacica</b><small>Sua opinião ajuda a melhorar.</small></div></div><section class="ev-card" id="evaluation-public" aria-live="polite"><p>Carregando avaliação…</p></section></main>
  <script type="module" src="./src/evaluation_public.js?v=20261109-avaliacoes"></script>
</body>
</html>
